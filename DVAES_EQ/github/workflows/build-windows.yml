name: Build DVAES EQ VST3 (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target DVAES_EQ_VST3 --parallel 4
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Filter '*.vst3' -Recurse | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found in build folder.' }
          Compress-Archive -Path $plugin.FullName -DestinationPath DVAES_EQ_Windows_VST3.zip -Force
      - name: Upload ready plugin
        uses: actions/upload-artifact@v4
        with:
          name: DVAES_EQ_Windows_VST3
          path: DVAES_EQ_Windows_VST3.zip
          if-no-files-found: error
